<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitor de Sensores</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
            opacity: 0.8;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .status {
            margin-bottom: 20px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h2 {
            font-size: 20px;
            margin-top: 0;
        }

        .valor {
            font-size: 42px;
            font-weight: bold;
            margin: 20px 0;
        }

        .unidade {
            color: #666;
        }

        .rodape {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Monitor de Sensores</h1>
        <p>Arduino + Firebase</p>
    </header>

    <div class="container">

        <div class="status" id="status">
            Conectando ao Firebase...
        </div>

        <div class="cards">

            <div class="card">
                <h2>🌡️ Temperatura</h2>

                <div class="valor">
                    <span id="temperatura">--</span>
                </div>

                <div class="unidade">°C</div>
            </div>

            <div class="card">
                <h2>📳 Vibração</h2>

                <div class="valor">
                    <span id="vibracao">--</span>
                </div>

                <div class="unidade" id="vibracaoTexto">
                    Aguardando
                </div>
            </div>

            <div class="card">
                <h2>🔊 Ruído</h2>

                <div class="valor">
                    <span id="ruido">--</span>
                </div>

                <div class="unidade">Valor analógico</div>
            </div>

        </div>

        <div class="rodape">
            Última atualização: <span id="atualizacao">--</span>
        </div>

    </div>

    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


        // =====================================
        // CONFIGURAÇÃO DO FIREBASE
        // =====================================

        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD-stbeo7N_vBsyNa3FFILrz5PyNlHKQuE",
  authDomain: "monitor-sensores-b1be1.firebaseapp.com",
  databaseURL: "https://monitor-sensores-b1be1-default-rtdb.firebaseio.com",
  projectId: "monitor-sensores-b1be1",
  storageBucket: "monitor-sensores-b1be1.firebasestorage.app",
  messagingSenderId: "225709909415",
  appId: "1:225709909415:web:5f1024f6a0e88bc5288282",
  measurementId: "G-978HLXLFYQ"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);


        // =====================================
        // INICIALIZAÇÃO
        // =====================================

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        // Referência ao caminho dos sensores

        const sensoresRef = ref(database, "sensores");


        // =====================================
        // RECEBER DADOS EM TEMPO REAL
        // =====================================

        onValue(sensoresRef, (snapshot) => {

            const dados = snapshot.val();

            if (!dados) {
                document.getElementById("status").textContent =
                    "Aguardando dados dos sensores...";
                return;
            }

            // Temperatura

            if (dados.temperatura !== undefined) {
                document.getElementById("temperatura").textContent =
                    Number(dados.temperatura).toFixed(1);
            }

            // Vibração

            if (dados.vibracao !== undefined) {

                const vibracao = Number(dados.vibracao);

                document.getElementById("vibracao").textContent =
                    vibracao;

                document.getElementById("vibracaoTexto").textContent =
                    vibracao === 1 ? "Vibração detectada" : "Sem vibração";
            }

            // Ruído

            if (dados.ruido !== undefined) {
                document.getElementById("ruido").textContent =
                    dados.ruido;
            }

            // Status

            document.getElementById("status").textContent =
                "Conectado ao Firebase";

            document.getElementById("atualizacao").textContent =
                new Date().toLocaleTimeString("pt-BR");

        });

    </script>

</body>
</html>
